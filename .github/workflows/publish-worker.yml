name: Publish worker image

# Builds worker/Dockerfile and pushes it to GHCR so a host (Render, Fly, a box
# with docker) can run the worker by pulling an image rather than building one.
#
# This is also the only place the Dockerfile is exercised at all. The CI
# workflow deliberately installs a light dependency set and never imports
# ultralytics (see worker/requirements-ci.txt), so a break in the real runtime
# image would otherwise surface for the first time during a deploy.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/publish-worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/publish-worker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/worker

jobs:
  publish:
    name: build, smoke test, push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image locally
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          # Loaded into the local daemon rather than pushed, so the smoke test
          # below runs against the exact bytes that will be published.
          load: true
          push: false
          tags: ${{ env.IMAGE }}:smoke
          # Torch and its CUDA-less wheels dominate the build. Without a cache
          # every run re-downloads roughly a gigabyte.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ffmpeg is present
        # The worker starts fine without it and then fails every capture, which
        # looks like four dead cameras rather than a missing package.
        run: docker run --rm ${{ env.IMAGE }}:smoke ffmpeg -version | head -1

      - name: The CLI starts and reports its commands
        run: docker run --rm ${{ env.IMAGE }}:smoke python -m hallcheck.cli --help

      - name: Model weights are baked in, not fetched at runtime
        # --network none is the whole point of this step. The Dockerfile bakes
        # the weights so a cold start does not depend on a third-party host
        # being up; if that ever silently stops working, the container would
        # quietly reach out on first run instead, and only fail when the host
        # is down. With no network, a missing weight file fails here.
        run: |
          docker run --rm --network none ${{ env.IMAGE }}:smoke \
            python -c "from ultralytics import YOLO; YOLO('yolo11n.pt'); print('weights loaded offline')"

      - name: torch is the CPU build, with no CUDA runtime in the image
        # The reason this is a test and not a comment: `pip install .` alone
        # resolves torch from PyPI, whose linux x86_64 wheel is the CUDA build
        # and vendors over a gigabyte of NVIDIA runtime onto a machine with no
        # GPU. The Dockerfile installs torch from the CPU index first to avoid
        # that, and nothing about a passing build would reveal if that line
        # were dropped - the image would just quietly get a gigabyte bigger
        # and need a larger instance.
        #
        # `-i` is load-bearing. Without it `docker run` does not attach stdin,
        # so `python -` reads EOF, runs an empty program and exits 0 - a test
        # that passes without executing a line of itself. The sentinel below
        # is the guard against that happening again: a vacuous run prints
        # nothing, so the grep fails even though the exit code is clean.
        run: |
          set +e
          out=$(docker run --rm -i --network none ${{ env.IMAGE }}:smoke python - <<'PY'
          import torch

          assert torch.version.cuda is None, f"CUDA build of torch: {torch.version.cuda}"
          assert not torch.cuda.is_available(), "torch reports a GPU in a CPU image"
          print(f"CPU-BUILD-CONFIRMED torch {torch.__version__}")
          PY
          )
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 0 || { echo "the torch check failed"; exit 1; }
          echo "$out" | grep -q CPU-BUILD-CONFIRMED \
            || { echo "the torch check did not execute - stdin not attached?"; exit 1; }

      - name: No CUDA runtime packages are installed
        # The assertion above reads torch's own metadata. This one reads the
        # environment, so a wheel that reports itself as CPU while still
        # dragging the NVIDIA libraries in as dependencies is still caught.
        #
        # nvidia-ml-py is exempt and is not an oversight. It is a pure-Python
        # binding to NVML, about 100 KB with no CUDA binaries in it, which
        # ultralytics depends on unconditionally so it can report GPU
        # telemetry when there is a GPU to report on. It arrives whichever
        # torch wheel is installed, so matching it says nothing about the one
        # that is. The packages this is looking for are the ones that vendor
        # shared objects - nvidia-cudnn-cu12, nvidia-cublas-cu12, nvidia-nccl
        # and the rest - and those are still matched.
        run: |
          set +e
          nvidia=$(docker run --rm --network none ${{ env.IMAGE }}:smoke \
            pip list --format=freeze | grep -i '^nvidia-' | grep -vi '^nvidia-ml-py==')
          set -e
          if [ -n "$nvidia" ]; then
            echo "CUDA runtime packages present in a CPU-only image:"
            echo "$nvidia"
            exit 1
          fi
          echo "no CUDA runtime packages"

      - name: Missing configuration fails fast with a readable error
        # Documented behaviour: exit code 2 and every missing variable named at
        # once, rather than discovering them one redeploy at a time.
        run: |
          set +e
          output=$(docker run --rm --network none ${{ env.IMAGE }}:smoke python -m hallcheck.cli once 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
          echo "$output" | grep -q "SUPABASE_URL" || { echo "error did not name SUPABASE_URL"; exit 1; }
          echo "$output" | grep -q "SUPABASE_SERVICE_KEY" || { echo "error did not name SUPABASE_SERVICE_KEY"; exit 1; }

      - name: It runs as a non-root user
        run: |
          user=$(docker run --rm ${{ env.IMAGE }}:smoke id -un)
          test "$user" = "worker" || { echo "expected to run as worker, got $user"; exit 1; }
          echo "running as $user"

      - name: Report image size
        run: docker image inspect ${{ env.IMAGE }}:smoke --format '{{.Size}}' | awk '{printf "%.0f MB\n", $1/1024/1024}'

      # Nothing is published from a pull request. A PR gets the build and every
      # check above; only main produces an image a host could pull.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Served entirely from the cache populated above, so this re-uses the
          # layers the smoke test just ran against rather than rebuilding them.
          cache-from: type=gha
