name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    name: worker (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest --cov=hallcheck --cov-report=term-missing

  web:
    name: web (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # No Supabase credentials here on purpose. The app is built to render a
      # setup notice when they are absent, so the build is exercised without
      # putting project keys into CI.
      - run: npm run build

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        # 16 for `security_invoker` on views, which 0002 relies on.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Create the roles Supabase provides
        # `anon` and `authenticated` exist in a Supabase project but not in
        # stock Postgres, and 0002 grants to them by name. Creating them here
        # is what lets a plain container verify the policies parse.
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin;"
          psql -v ON_ERROR_STOP=1 -c "create role authenticated nologin;"

      - name: Apply every migration in order
        # ON_ERROR_STOP turns a SQL typo into a failed build instead of a
        # half-applied schema and a zero exit code.
        run: |
          for file in db/migrations/*.sql; do
            echo "--- $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Re-apply to prove the migrations are idempotent
        # A redeploy that replays migrations must not fail. Anything that is
        # not guarded by IF NOT EXISTS or OR REPLACE shows up here.
        run: |
          for file in db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Check the tables and views the worker and site expect
        run: |
          psql -v ON_ERROR_STOP=1 -c "select hall_id, name from public.halls_public order by hall_id;"
          psql -v ON_ERROR_STOP=1 -c "select count(*) from public.hall_latest;"

      - name: Verify the anon access model
        # The anon key is public by construction. This asserts what it can read
        # and, more importantly, everything it must be refused. A grant added
        # for convenience and forgotten fails the build here.
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/access_model.sql

      - name: Verify every ROI polygon
        # The worker validates its ROI per hall, at startup, in production - so
        # a bad polygon is one hall quietly not reporting while the rest carry
        # on. The same rules are asserted here against every row instead.
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/roi_sanity.sql
