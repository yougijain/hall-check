# Render blueprint for the capture worker.
#
# The web app is NOT here - it deploys to Vercel from the same repository with
# its root directory set to `web/`. One repo, two targets, one schema between
# them.
#
# A worker, not a cron job: the counts are only useful if their timestamps are
# accurate, and hosted cron schedulers drift by minutes. See
# worker/hallcheck/scheduler.py.

services:
  - type: worker
    name: hallcheck-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    # Not starter. Starter is 512 MB, and importing torch costs roughly
    # 400-500 MB resident before YOLO is even loaded - the container OOMs
    # during startup rather than during a capture, which makes it look like a
    # broken image instead of an undersized instance.
    #
    # Measured footprint is about 700 MB with the model loaded and one frame
    # in flight. standard (2 GB) leaves real headroom; anything at or under
    # 1 GB is worth watching.
    #
    # Fly.io's shared-cpu-1x with 1 GB runs the same image for appreciably
    # less if cost matters more than headroom.
    plan: standard
    region: ohio
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      # Service role key. Bypasses row level security, so it lives here and
      # never in the web project's environment.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: HALLCHECK_MODEL
        value: yolo11n.pt
      - key: HALLCHECK_CONF_THRESHOLD
        value: "0.35"
      - key: HALLCHECK_INTERVAL_SECONDS
        value: "120"
      - key: HALLCHECK_CAPTURE_TIMEOUT
        value: "30"
